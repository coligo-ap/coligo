# =============================================================================
# CI/CD iOS (client app.coligo.client) — Codemagic
# =============================================================================
# Deux workflows de build PARTAGENT le même environnement + scripts (ancres YAML
# `&ios_env` / `&ios_scripts` / `&ios_artifacts` / `&ios_int`) :
#
#   - ios-client-app-store : AUTO sur push `main` touchant du natif → TestFlight.
#     Le web (server.url distant) se déploie par Vercel : inutile de rebuilder
#     l'app native sur une modif web-only (filtre changeset), on économise les
#     minutes Mac.
#   - ios-client-release   : sur TAG `release-*` → soumission App Store (revue
#     Apple), publication AUTO à l'approbation (AFTER_APPROVAL). C'est le signal
#     explicite « mettre en prod ».
#
# Le seul point manuel restant en prod iOS = la revue Apple par version (~24-48 h)
# et le renseignement du « What's New » de la nouvelle version dans App Store
# Connect. Aucune automatisation ne contourne la revue Apple.
# =============================================================================

workflows:
  ios-client-app-store:
    name: Coligo Client — iOS TestFlight (auto)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations: &ios_int
      # Nom EXACT donné à la clé lors de sa création dans Codemagic :
      # Team settings → Integrations → Developer Portal → Manage keys → Add key
      # (clé "App Store Connect API", rôle App Manager — PAS les clés .p8
      # APNs / Sign in with Apple créées sur developer.apple.com, c'en est
      # une troisième, distincte, créée sur appstoreconnect.apple.com →
      # Users and Access → Integrations).
      app_store_connect: coligo_asc
    environment: &ios_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.coligo.client
      xcode: latest
      node: lts
      vars:
        # Pas de .xcworkspace : Firebase est résolu via Swift Package Manager
        # (comme tous les autres plugins Capacitor), pas CocoaPods — voir la
        # note dans project.pbxproj / capacitor.config.ts sur le conflit
        # GoogleUtilities/PromisesObjC. On build directement le .xcodeproj.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # Groupe de variables à créer dans Codemagic : Team settings →
      # Environment variables → nouveau groupe nommé EXACTEMENT "firebase_ios"
      # → ajouter GOOGLE_SERVICE_INFO_PLIST_B64 (cocher "Secure") : contenu de
      # GoogleService-Info.plist encodé en base64 — PAS le fichier lui-même
      # (jamais commité, cf. .gitignore).
      #   PowerShell : [Convert]::ToBase64String([IO.File]::ReadAllBytes("GoogleService-Info.plist")) | Set-Clipboard
      groups:
        - firebase_ios
    # DÉCLENCHEMENT AUTO — push sur `main` touchant du NATIF/config. Une modif
    # web-only (app/, components/, sauf lib/native) ne rebuild PAS l'app : elle
    # part déjà par Vercel puisque l'app charge server.url. ⚠️ Exige que le
    # webhook du dépôt soit connecté dans Codemagic (Team → Applications →
    # coligo → webhook GitHub actif).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    # `when` est un champ de WORKFLOW (pas sous `triggering`) : il SAUTE le build
    # si aucun fichier natif/config n'a changé (une modif web-only part par
    # Vercel). Ne s'applique qu'aux events push — un tag construit toujours
    # (workflow `ios-client-release`, sans `when`).
    when:
      changeset:
        includes:
          - "ios"
          - "capacitor.config.ts"
          - "scripts/ios-client-config.mjs"
          - "lib/native"
          - "package.json"
          - "package-lock.json"
          - "codemagic.yaml"
        excludes:
          - "**/*.md"
    scripts: &ios_scripts
      - name: Installer les dépendances Node
        script: npm ci
      - name: Régénérer le projet iOS (identité CLIENT)
        # cap sync ios régénère capacitor.config.json depuis capacitor.config.ts
        # (identité COMMERCE par défaut, pas de flavor iOS comme sur Android) —
        # ios-client-config.mjs le réécrit ensuite avec l'identité CLIENT.
        # Ne touche PAS project.pbxproj (packages SPM, signature, scheme —
        # tout ça est commité, pas régénéré par cap sync).
        script: |
          npx cap sync ios
          node scripts/ios-client-config.mjs
      - name: Restaurer GoogleService-Info.plist (Firebase push)
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "✖ GOOGLE_SERVICE_INFO_PLIST_B64 absent — le build sortirait sans push Firebase (crash au lancement, FirebaseApp.configure() l'exige)."
            exit 1
          fi
          node -e "require('fs').writeFileSync('ios/App/App/GoogleService-Info.plist', Buffer.from(process.env.GOOGLE_SERVICE_INFO_PLIST_B64, 'base64'))"
      - name: Récupérer certificat + profil de provisionnement
        # Depuis le renouvellement du cert marchand Apple Pay (16/08), le fetch
        # AUTOMATIQUE Codemagic ne rapporte AUCUN profil (le profil manuel du
        # portail est ignoré par l'API ASC — limitation Apple Pay) → ce step
        # échouait avec « Failed to set code signing settings » car le disque
        # était vide. On installe donc le profil COMMITTÉ ici aussi (même
        # logique que « Build .ipa signé », qui la rejoue sans danger).
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp ios/certs/Coligo_Client_Apple_Pay.mobileprovision "$PROFILES_DIR/"
          for p in "$PROFILES_DIR"/*.mobileprovision; do
            name=$(security cms -D -i "$p" | plutil -extract Name raw -o - -)
            echo "profil présent : $name"
            if [ "$name" != "Coligo Client Apple Pay" ]; then
              rm -f "$p"; echo "  → retiré (sans Apple Pay)"
            fi
          done
          xcode-project use-profiles
      - name: Numéro de build auto-incrémenté
        # App Store Connect refuse tout ré-upload dont le CFBundleVersion
        # n'est pas STRICTEMENT supérieur au précédent (même MARKETING_VERSION
        # inchangée). $BUILD_NUMBER = compteur Codemagic pour ce workflow,
        # déjà strictement croissant à chaque build → jamais besoin d'y
        # retoucher à la main.
        #
        # ⚠️ MARKETING_VERSION (CFBundleShortVersionString) est figée dans
        # project.pbxproj. Quand une version est APPROUVÉE sur l'App Store, son
        # train se FERME : Apple refuse alors tout nouveau build sur cette
        # version (erreurs 90186 / 90062). Il faut BUMPER MARKETING_VERSION
        # (les 2 occurrences Debug+Release de project.pbxproj) avant de rebuilder.
        script: |
          cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build .ipa signé
        # PROFIL « Coligo Client Apple Pay » IMPOSÉ — par FILTRAGE sur la
        # machine, pas par flag xcodebuild global (un flag global s'applique
        # aussi aux paquets SPM qui refusent tout profil → échec #18). Les
        # profils fabriqués par l'API ASC ne peuvent PAS contenir la
        # capability Apple Pay (limitation Apple) et la sélection auto
        # re-choisissait toujours « Coligo Client App Store » (#12-#17) : on
        # supprime donc du disque tout profil ≠ « Coligo Client Apple Pay »
        # (le profil MANUEL du portail, seul à porter Apple Pay + merchant),
        # puis use-profiles n'a plus qu'un candidat et l'applique cible par
        # cible. Si le profil manuel disparaît du portail : le recréer
        # (App Store, app.coligo.client, cert Apple Distribution d'Esam).
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          # Le téléchargeur automatique IGNORE le profil manuel du portail
          # (vérifié builds #16-#19, alors que cert/entitlements matchent) →
          # on INSTALLE le fichier committé (ios/certs/, aucun secret : certs
          # publics + entitlements). À renouveler avant le 15/07/2027
          # (expiration) ou si le certificat de distribution change.
          cp ios/certs/Coligo_Client_Apple_Pay.mobileprovision "$PROFILES_DIR/"
          for p in "$PROFILES_DIR"/*.mobileprovision; do
            name=$(security cms -D -i "$p" | plutil -extract Name raw -o - -)
            echo "profil présent : $name"
            if [ "$name" != "Coligo Client Apple Pay" ]; then
              rm -f "$p"; echo "  → retiré (sans Apple Pay)"
            fi
          done
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts: &ios_artifacts
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Push auto → TestFlight SEULEMENT (testeurs internes, sans revue).
        # La mise en prod App Store passe par le workflow `ios-client-release`
        # (tag), pour ne PAS soumettre à la revue Apple à chaque commit.
        submit_to_testflight: true
      email:
        recipients:
          - primefood69@gmail.com
        notify:
          success: true
          failure: true

  # ── PROD iOS — déclenché par un TAG `release-*` ────────────────────────────
  # `git tag release-2026-07-23 && git push --tags` → build + soumission App
  # Store, publication AUTO à l'approbation Apple. MÊME environnement/scripts que
  # le workflow TestFlight (ancres YAML) : rien à maintenir en double.
  ios-client-release:
    name: Coligo Client — iOS App Store (PROD, sur tag)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations: *ios_int
    environment: *ios_env
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "release-*"
          include: true
    scripts: *ios_scripts
    artifacts: *ios_artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Soumet à la revue App Store et PUBLIE automatiquement à l'approbation.
        # ⚠️ Apple review ~24-48 h par version ; le « What's New » de la nouvelle
        # MARKETING_VERSION doit être renseigné dans App Store Connect (ou hérité).
        submit_to_app_store: true
        release_type: AFTER_APPROVAL
      email:
        recipients:
          - primefood69@gmail.com
        notify:
          success: true
          failure: true

  # ── PROD/TEST Android — Google Play (client app.coligo.client) ─────────────
  # AUTO sur push `main` touchant du natif Android → interne + alpha.
  # Sur TAG `release-*` → tente aussi la PRODUCTION (verrouillée par Google tant
  # que l'accès prod n'est pas accordé : l'échec est toléré, le test passe).
  #
  # Secrets (groupe Codemagic `android_client`, tous SÉCURISÉS, déjà posés par
  # l'API) : GOOGLE_SERVICES_JSON_B64, PLAY_SERVICE_ACCOUNT_B64, CM_KEYSTORE_B64,
  # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD. Aucun de ces fichiers
  # n'est commité (keystore, google-services.json, service account = gitignorés).
  android-client-play:
    name: Coligo Client — Android Play (auto push → interne + alpha)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment: &android_env
      java: 21
      node: lts
      groups:
        - android_client
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    # `when` = champ de WORKFLOW (pas sous `triggering`) : saute le build si
    # aucun fichier natif Android n'a changé (le web part par Vercel). Ne
    # s'applique qu'au push — le tag construit toujours (android-client-release).
    when:
      changeset:
        includes:
          - "android"
          - "capacitor.config.ts"
          - "scripts/build-client-aab.mjs"
          - "scripts/android-assets.mjs"
          - "scripts/ci-android-versioncode.mjs"
          - "scripts/play-upload.mjs"
          - "scripts/play-promote.mjs"
          - "package.json"
          - "codemagic.yaml"
        excludes:
          - "**/*.md"
    scripts: &android_scripts
      - name: Dépendances Node
        script: npm ci
      - name: Restaurer les secrets (google-services / keystore / service account)
        script: |
          set -e
          for v in GOOGLE_SERVICES_JSON_B64 PLAY_SERVICE_ACCOUNT_B64 CM_KEYSTORE_B64 CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            eval "val=\$$v"
            if [ -z "$val" ]; then echo "✖ secret $v absent (groupe android_client)"; exit 1; fi
          done
          node -e "require('fs').writeFileSync('android/app/google-services.json', Buffer.from(process.env.GOOGLE_SERVICES_JSON_B64,'base64'))"
          node -e "require('fs').writeFileSync('play-service-account.json', Buffer.from(process.env.PLAY_SERVICE_ACCOUNT_B64,'base64'))"
          node -e "require('fs').writeFileSync('android/coligo-release-ci.jks', Buffer.from(process.env.CM_KEYSTORE_B64,'base64'))"
          printf 'storeFile=coligo-release-ci.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$CM_KEYSTORE_PASSWORD" "$CM_KEY_ALIAS" "$CM_KEY_PASSWORD" > android/keystore.properties
      - name: versionCode auto (Play max + 1)
        script: node scripts/ci-android-versioncode.mjs
      - name: Build AAB signé (flavor client)
        # build-client-aab.mjs est portable : sur Linux, existsSync(JBR)=false →
        # utilise le JAVA_HOME système (Java 21 fixé ci-dessus). Les res du flavor
        # client sont commitées → pas de --assets.
        script: node scripts/build-client-aab.mjs
      - name: Publier sur Google Play
        script: |
          set -e
          # Toujours : interne + alpha (doivent réussir).
          node scripts/play-upload.mjs --track alpha --status completed --also internal
          # Sur TAG release-* SEULEMENT (CM_TAG posé par Codemagic) : tenter la
          # PRODUCTION (verrou Google toléré → le test reste publié).
          if [ -n "$CM_TAG" ]; then
            VC=$(cat android/.ci-versioncode)
            node scripts/play-promote.mjs --to production --version "$VC" --status completed \
              || echo "⚠ PRODUCTION Google verrouillée (accès non accordé) — test publié, prod ignorée."
          fi
    artifacts: &android_artifacts
      - android/app/build/outputs/bundle/**/*.aab
    publishing: &android_publishing
      email:
        recipients:
          - primefood69@gmail.com
        notify:
          success: true
          failure: true

  # ── PROD Android sur TAG `release-*` — interne + alpha + production ─────────
  # Mêmes env/scripts (ancres YAML). CM_TAG est posé → l'étape de publication
  # tente la production en plus des pistes de test.
  android-client-release:
    name: Coligo Client — Android Play (PROD, sur tag)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment: *android_env
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "release-*"
          include: true
    scripts: *android_scripts
    artifacts: *android_artifacts
    publishing: *android_publishing

  # ── Sonde LECTURE SEULE du statut App Store (aucun build) ──────────────────
  # Interroge l'API App Store Connect avec les identifiants de l'intégration :
  # état de la version (Prepare for Submission / Waiting for Review /
  # Ready for Sale…), soumissions en cours. Déclenchée à la main / par API.
  asc-status:
    name: ASC — statut App Store (lecture seule)
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: coligo_asc
    scripts:
      - name: Statut de l'app et des versions
        script: |
          set +e
          echo "=== APP 6790816270 ==="
          app-store-connect apps get 6790816270
          echo "=== VERSIONS APP STORE (états) ==="
          app-store-connect apps app-store-versions 6790816270
          echo "=== BUILDS RÉCENTS ==="
          app-store-connect apps builds 6790816270 | head -60
          exit 0
