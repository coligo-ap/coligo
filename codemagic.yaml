workflows:
  ios-client-app-store:
    name: Coligo Client — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nom EXACT donné à la clé lors de sa création dans Codemagic :
      # Team settings → Integrations → Developer Portal → Manage keys → Add key
      # (clé "App Store Connect API", rôle App Manager — PAS les clés .p8
      # APNs / Sign in with Apple créées sur developer.apple.com, c'en est
      # une troisième, distincte, créée sur appstoreconnect.apple.com →
      # Users and Access → Integrations).
      # Renommer ci-dessous si la clé est créée sous un autre nom.
      app_store_connect: coligo_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.coligo.client
      xcode: latest
      cocoapods: default
      node: lts
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      # Groupe de variables à créer dans Codemagic : Team settings →
      # Environment variables → nouveau groupe nommé EXACTEMENT "firebase_ios"
      # → ajouter GOOGLE_SERVICE_INFO_PLIST_B64 (cocher "Secure") : contenu de
      # GoogleService-Info.plist encodé en base64 — PAS le fichier lui-même
      # (jamais commité, cf. .gitignore).
      #   PowerShell : [Convert]::ToBase64String([IO.File]::ReadAllBytes("GoogleService-Info.plist")) | Set-Clipboard
      groups:
        - firebase_ios
    scripts:
      - name: Installer les dépendances Node
        script: npm ci
      - name: Régénérer le projet iOS (identité CLIENT)
        # cap sync ios régénère capacitor.config.json depuis capacitor.config.ts
        # (identité COMMERCE par défaut, pas de flavor iOS comme sur Android) —
        # ios-client-config.mjs le réécrit ensuite avec l'identité CLIENT.
        script: |
          npx cap sync ios
          node scripts/ios-client-config.mjs
      - name: Restaurer GoogleService-Info.plist (Firebase push)
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "✖ GOOGLE_SERVICE_INFO_PLIST_B64 absent — le build sortirait sans push Firebase (crash au lancement, FirebaseApp.configure() l'exige)."
            exit 1
          fi
          node -e "require('fs').writeFileSync('ios/App/App/GoogleService-Info.plist', Buffer.from(process.env.GOOGLE_SERVICE_INFO_PLIST_B64, 'base64'))"
      - name: Installer les Pods (Firebase uniquement)
        script: |
          cd ios/App && pod install
      - name: Récupérer certificat + profil de provisionnement
        script: xcode-project use-profiles
      - name: DEBUG workspace (temporaire — diagnostic exit 74)
        script: |
          echo "--- ios/App ---"
          ls -la ios/App
          echo "--- xcworkspace/contents.xcworkspacedata ---"
          cat "ios/App/App.xcworkspace/contents.xcworkspacedata" || echo "ABSENT"
          echo "--- schemes trouvés ---"
          find ios/App -iname "*.xcscheme"
          echo "--- pod --version / xcodebuild -version ---"
          pod --version || true
          xcodebuild -version
          echo "--- xcodebuild -workspace ... -list ---"
          xcodebuild -workspace "$XCODE_WORKSPACE" -list || true
          echo "--- xcodebuild -showBuildSettings (verbose, sans wrapper) ---"
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -showBuildSettings || true
      - name: Build .ipa signé
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - primefood69@gmail.com
        notify:
          success: true
          failure: true

    # Pas de déclenchement automatique volontairement : tant que le bouton
    # « Continuer avec Apple » n'est pas codé côté UI, chaque build se lance à
    # la main depuis le dashboard Codemagic (bouton « Start new build »).
