  <path d="M26 46 q-2 16 10 20 q8 3 12 -4 l0 -20 q-12 -8 -22 4Z" fill="url(#cr1)"/>
  <path d="M70 46 q2 16 -10 20 q-8 3 -12 -4 l0 -20 q12 -8 22 4Z" fill="url(#cr1)"/>
