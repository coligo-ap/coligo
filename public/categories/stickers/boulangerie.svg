<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="cr1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCB7C"/><stop offset="1" stop-color="#E8963B"/>
    </linearGradient>
    <linearGradient id="cr2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5B25C"/><stop offset="1" stop-color="#D67F2C"/>
    </linearGradient>
  </defs>
  <ellipse cx="48" cy="74" rx="28" ry="6" fill="#0B0C12" opacity=".08"/>
  <!-- cornes (extrémités qui s'enroulent vers le bas) -->
