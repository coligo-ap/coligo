// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Alignement Java/Kotlin sur 21 (cible par défaut de Capacitor 8). Le module
// capacitor-geolocation force `kotlin { jvmToolchain(21) }` : laisser le Java
// en 17 casse le build release avec « Inconsistent JVM-target compatibility
// (Java 17 vs Kotlin 21) ». On harmonise donc TOUT en 21.
// → Build avec un JDK 21. Le JBR fourni par Android Studio convient :
//   JAVA_HOME="C:\Program Files\Android\Android Studio\jbr".
//   Le JDK 17 seul ne suffit plus (geolocation exige un toolchain 21).
subprojects {
    afterEvaluate {
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
