# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Plafonds mémoire — le build tourne sur une machine à 8 Go.
#
# Trois JVM cohabitent pendant un build Android : le daemon Gradle, le daemon
# Kotlin et les workers (dexing/R8). Sans plafond, le daemon Kotlin réserve 2 Go
# à lui seul et les workers se multiplient au nombre de cœurs — la somme dépasse
# la RAM physique et la JVM meurt sur un `malloc` (« insufficient memory for the
# Java Runtime Environment to continue »). Les valeurs ci-dessous bornent
# l'empreinte totale à ~2,8 Go.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m

# 4 cœurs, mais 2 workers suffisent : au-delà, dexing et R8 tournent en
# parallèle et chacun réserve son propre tas.
org.gradle.workers.max=2

# Le parallélisme inter-projets multiplierait encore les JVM concurrentes.
org.gradle.parallel=false

# La surveillance du système de fichiers garde un index en mémoire pour un gain
# nul ici (build ponctuel, pas de watch continu).
org.gradle.vfs.watch=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
